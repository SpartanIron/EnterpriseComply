# Dependabot version updates.
#
# Security updates were already enabled at the repository level, but those only
# fire once a CVE is published against a pinned version. Version updates keep the
# tree close to upstream so the window between a fix landing and this repo
# carrying it stays small - which is what SOC 2 CC7.1 and NIST SI-2 (flaw
# remediation) actually ask for.
#
# Updates are grouped so the volume stays reviewable: one PR per ecosystem per
# week for patch/minor, and separate PRs for majors, which need a human.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      production-patch-minor:
        dependency-type: production
        update-types:
          - patch
          - minor
      development-patch-minor:
        dependency-type: development
        update-types:
          - patch
          - minor
    ignore:
      # Majors land as individual PRs so breaking changes get a real review.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
