# EnterpriseComply — CI: Migration Safety Gate (P1-19)
# Two-layer protection against unsafe database migrations reaching production.
#
# Layer 1 — Static analysis (no database required, runs in <10s):
#   Scans startup.service.ts and any .sql migration files for destructive SQL
#   (DROP TABLE, DROP COLUMN, TRUNCATE, etc.). Blocks CI unless the line has an
#   explicit approval comment: -- MIGRATION-APPROVED: <reason>
#
# Layer 2 — Fresh-database integration test:
#   Starts the API server against a completely blank PostgreSQL instance.
#   StartupService runs every migration on boot. After the server is healthy,
#   verify-schema.mjs checks that every expected table was created.
#   Fails if StartupService crashes, swallows errors, or leaves tables missing.
#
# Results surface as required PR status checks — blocks merge on failure.

name: Migration Safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Layer 1: Destructive-change static scan ──────────────────────────────────
  static-scan:
    name: Destructive SQL scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No deps needed — check-migrations.mjs uses only Node built-ins + pg
      # pg is already in api-server deps; install just what the script needs
      - name: Install pg client for script
        run: npm install --no-save pg@8

      - name: Scan for destructive SQL patterns
        # Fails if any DROP TABLE / DROP COLUMN / TRUNCATE / ALTER TABLE DROP
        # is found without an explicit -- MIGRATION-APPROVED: comment.
        # Exit 0 = clean, Exit 1 = unapproved destructive change found.
        run: node artifacts/api-server/scripts/check-migrations.mjs

  # ── Layer 2: Fresh-DB migration integration test ─────────────────────────────
  fresh-db-test:
    name: Fresh-database migration test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ciuser
          POSTGRES_PASSWORD: cipassword
          POSTGRES_DB: migration_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://ciuser:cipassword@localhost:5432/migration_test
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-test-secret-not-for-production' }}
      BETTER_AUTH_URL: http://localhost:8080
      NODE_ENV: development
      PORT: 8080
      RESEND_API_KEY: ci-no-op
      WEBHOOK_SECRET: ci-webhook-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Start the API server against the completely blank postgres instance.
      # StartupService.onApplicationBootstrap() is the system under test here —
      # it must run every migration without throwing, swallowing errors, or
      # leaving tables missing.
      - name: Start API server against blank database
        run: |
          pnpm --filter @workspace/api-server run dev > /tmp/migration-test.log 2>&1 &
          echo "API_PID=$!" >> $GITHUB_ENV

      - name: Wait for server to be healthy
        # The server must reach /api/healthz — which only happens AFTER
        # StartupService finishes running migrations. A crash or unhandled
        # migration error will keep the server from ever responding.
        run: |
          echo "Waiting for http://localhost:8080/api/healthz ..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/api/healthz > /dev/null 2>&1; then
              echo "Server healthy after ${i}s — migrations completed."
              exit 0
            fi
            sleep 2
          done
          echo "=== SERVER NEVER BECAME HEALTHY — migration likely failed ===" >&2
          cat /tmp/migration-test.log >&2
          exit 1

      - name: Verify all expected tables were created
        # Connects directly to the blank PostgreSQL instance and checks that every
        # table listed in verify-schema.mjs exists. A missing table means
        # StartupService silently skipped or failed part of the migration.
        run: node artifacts/api-server/scripts/verify-schema.mjs

      # ── Phase 1: the risk seed must be idempotent across boots ───────────────
      #
      # seedCommonRisks() used to re-insert twenty rows per org on every single
      # start, because it read a COUNT(*) into riskCnt and then never looked at
      # it. Twenty-eight boots produced 560 rows from a 20-row seed.
      #
      # A one-boot assertion would have passed on a blank database and caught
      # none of that, so the invariants are checked across three boots, with the
      # pre-migration state deliberately manufactured in between: boot 1 sets up
      # a duplicate group, boot 2 must collapse it and insert nothing, and boot 3
      # must change nothing at all.
      - name: Risk seed invariants (boot 1) and manufacture the pre-migration state
        run: node artifacts/api-server/scripts/risk-seed-invariants.mjs --verify-boot1

      - name: Restart API server (boot 2)
        run: |
          kill $API_PID 2>/dev/null || true
          # pnpm spawns node as a child, so $! alone can leave the port held and
          # the next boot dies with EADDRINUSE instead of telling us anything.
          pkill -f "src/main.ts" 2>/dev/null || true
          sleep 5
          pnpm --filter @workspace/api-server run dev > /tmp/migration-test-boot2.log 2>&1 &
          echo "API_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/api/healthz > /dev/null 2>&1; then
              echo "Boot 2 healthy after ${i}s."
              exit 0
            fi
            sleep 2
          done
          echo "=== BOOT 2 NEVER BECAME HEALTHY ===" >&2
          cat /tmp/migration-test-boot2.log >&2
          exit 1

      - name: Risk seed invariants (boot 2) - repair collapsed, seeder stood down
        run: node artifacts/api-server/scripts/risk-seed-invariants.mjs --verify-boot2

      - name: Restart API server (boot 3)
        run: |
          kill $API_PID 2>/dev/null || true
          # pnpm spawns node as a child, so $! alone can leave the port held and
          # the next boot dies with EADDRINUSE instead of telling us anything.
          pkill -f "src/main.ts" 2>/dev/null || true
          sleep 5
          pnpm --filter @workspace/api-server run dev > /tmp/migration-test-boot3.log 2>&1 &
          echo "API_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/api/healthz > /dev/null 2>&1; then
              echo "Boot 3 healthy after ${i}s."
              exit 0
            fi
            sleep 2
          done
          echo "=== BOOT 3 NEVER BECAME HEALTHY ===" >&2
          cat /tmp/migration-test-boot3.log >&2
          exit 1

      - name: Risk seed invariants (boot 3) - re-running the repair changed nothing
        run: node artifacts/api-server/scripts/risk-seed-invariants.mjs --verify-boot3

      # ── Phase 1: the posture single source of truth ──────────────────────────
      #
      # Rebuilds the exact control set that produced the five-way metric
      # discrepancy and asserts the SSOT reports it correctly while the legacy
      # arithmetic still gets it wrong in the diagnosed ways. Fails if anyone
      # reintroduces derive-by-subtraction or counts result rows instead of
      # control objectives.
      - name: Posture SSOT regression guard
        working-directory: artifacts/api-server
        run: node --import @swc-node/register/esm-register scripts/posture-ssot.test.ts

      # ── Phase 1b: one mapping source, and the cutover ────────────────────
      #
      # Asserts the three competing mapping sources have become one, that the
      # notation bridge holds on the cases that motivated it, and that the SSOT
      # and the denormalised columns agree. Also fails the build if a local
      # mapping table or a second copy of the requirement weights reappears in
      # application code, which is the way this class of bug comes back.
      - name: Mapping consolidation and cutover guard
        working-directory: artifacts/api-server
        run: node --import @swc-node/register/esm-register scripts/mapping-consolidation.test.ts

      # ── Phase 1c: the credential boundary and the trend ──────────────────
      #
      # Two live measurements, both taken against production before this phase:
      # the monitoring endpoint returned integration credentials as ciphertext,
      # and the score-history endpoint generated a ninety-day curve whose latest
      # point read 22 while the posture SSOT read 3.
      #
      # The guard self-tests its own leak detector before trusting it, and
      # creates a connected integration holding credential material so the
      # redaction assertions are not passing on an empty set.
      - name: API exposure and trend integrity guard
        working-directory: artifacts/api-server
        run: node --import @swc-node/register/esm-register scripts/api-exposure.test.ts

      # ── Phase 1c: the surfaces that render posture ──────────────────
      #
      # Four statuses, a scoreBasis block, two coverage warnings and a catalog
      # inconsistency were all being served and none of them rendered. This
      # asserts the API carries them and that the pages read them, because a
      # number nobody renders is the same as a number nobody has.
      #
      # Creates a control in warning first: a blank database has none, which is
      # how the bucket went missing with every test green.
      - name: Posture surfaces guard
        working-directory: artifacts/api-server
        run: node --import @swc-node/register/esm-register scripts/posture-surfaces.test.ts

      # ── Phase 1c: FISMA as a pass-through, and the FIPS 199 tag ──────────
      #
      # FISMA was deferred out of Phase 1 with a guard asserting it stayed out.
      # It has now shipped, so what is guarded is the shape: no mapping rows under
      # a fisma key, an identical control set to 800-53, a response that names
      # what it borrowed, and an uncategorised system reporting itself as such
      # rather than defaulting to low.
      - name: FISMA pass-through and FIPS 199 guard
        working-directory: artifacts/api-server
        run: node --import @swc-node/register/esm-register scripts/fisma-pass-through.test.ts

      # The rollback for the FIPS 199 column, exercised rather than asserted.
      # Dry run only: it must report the column and change nothing without
      # --confirm.
      - name: FIPS 199 rollback dry run
        working-directory: artifacts/api-server
        run: node scripts/rollback-fisma-fips199.cjs --dry-run

      # The rollback for the drift ledger, also exercised rather than asserted.
      - name: Drift ledger rollback dry run
        working-directory: artifacts/api-server
        run: node scripts/rollback-posture-drift-ledger.cjs --dry-run

      # ── Customer-uploaded policy documents ───────────────────────────────
      #
      # The upload endpoint takes attacker-controlled bytes from a browser and
      # serves them back. The guard re-runs the cases that decide whether that
      # is safe rather than inspecting the code: markdown carrying a script tag
      # and an SVG are refused, a .pdf whose bytes are a ZIP is refused, the
      # served Content-Type comes from the bytes and not from the client, and
      # nothing but the download route can emit contentBase64.
      #
      # It also asserts the partial unique index exists by trying to insert a
      # second current version, because an index that failed to create looks
      # exactly like one that did until two people upload at the same moment.
      - name: Policy document upload guard
        working-directory: artifacts/api-server
        run: node --import @swc-node/register/esm-register scripts/policy-upload.test.ts

      # The rollback for the policy document store, exercised rather than
      # asserted. Dry run only: it must report the document count and the stored
      # byte total, and destroy nothing without --confirm.
      - name: Policy document rollback dry run
        working-directory: artifacts/api-server
        run: node scripts/rollback-policy-documents.cjs --dry-run

      # ── Real integration connectors ──────────────────────────────────────
      #
      # connectDemo() decided each control's status with Math.random() and wrote
      # the result into org_control_results. A regression would not look like a
      # crash, it would look like a working feature, so most of this guard is
      # about absence: no random number generation in the service, no
      # demo-connect route in the controller, no connector claiming to be live
      # without a verification request behind it, and no declared secret outside
      # the redaction set.
      #
      # Makes no outbound requests. Verifying a real credential needs a real
      # credential, which CI does not have.
      - name: Integration connector guard
        working-directory: artifacts/api-server
        run: node --import @swc-node/register/esm-register scripts/integration-connectors.test.ts

      # Guard: retracting a connector-written control result.
      #
      # The two rows the old demo-connect path fabricated could not be
      # withdrawn by any endpoint, so retraction is now a first-class
      # operation. The property that matters most here is negative: the write
      # must not carry manualOverride, because a row that carries it tells an
      # assessor that a named person attested to a control nothing tested.
      #
      # Pure function plus source assertions. No database, no network.
      - name: Control result retraction guard
        working-directory: artifacts/api-server
        run: node --import @swc-node/register/esm-register scripts/control-result-clear.test.ts


      - name: Print migration log excerpt (always — useful for debugging)
        if: always()
        run: |
          echo "=== API server log (last 60 lines) ==="
          tail -60 /tmp/migration-test.log 2>/dev/null || echo "(no log)"

      - name: Upload full migration log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-test-log
          path: /tmp/migration-test.log
          retention-days: 7

      - name: Stop server
        if: always()
        run: kill $API_PID 2>/dev/null || true
